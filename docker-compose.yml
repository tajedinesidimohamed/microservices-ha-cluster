# Configuration commune aux 3 réplicas de l'API (ancre YAML réutilisée ci-dessous)
x-api: &api
  build: ./services/api
  image: microservices-ha-cluster/api:1.0.0
  restart: unless-stopped
  networks: [backend]

services:
  api1:
    <<: *api
    container_name: api1
    hostname: api1
  api2:
    <<: *api
    container_name: api2
    hostname: api2
  api3:
    <<: *api
    container_name: api3
    hostname: api3

  auth:
    build: ./services/auth
    image: microservices-ha-cluster/auth:1.0.0
    container_name: auth
    hostname: auth
    restart: unless-stopped
    networks: [backend]

  orders:
    build: ./services/orders
    image: microservices-ha-cluster/orders:1.0.0
    container_name: orders
    hostname: orders
    restart: unless-stopped
    networks: [backend]

  nginx:
    image: nginx:1.27.2-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    # Nginx démarre seulement quand les services sont sains
    depends_on:
      api1: { condition: service_healthy }
      api2: { condition: service_healthy }
      api3: { condition: service_healthy }
      auth: { condition: service_healthy }
      orders: { condition: service_healthy }
    networks: [backend]

networks:
  backend:
