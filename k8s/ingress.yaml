# Ingress : point d'entrée unique, routage par chemin (comme Nginx en docker compose)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ha-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service: { name: auth, port: { number: 8000 } }
          - path: /orders
            pathType: Prefix
            backend:
              service: { name: orders, port: { number: 8000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8000 } }
