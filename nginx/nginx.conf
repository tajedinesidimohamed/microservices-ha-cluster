worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Logs au format JSON (réutilisables dans une stack ELK)
    log_format json_logs escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_logs;
    error_log  /var/log/nginx/error.log warn;

    # Round-robin (par défaut) : après 3 échecs, le serveur est écarté 30 s
    upstream api_backend {
        server api1:8000 max_fails=3 fail_timeout=30s;
        server api2:8000 max_fails=3 fail_timeout=30s;
        server api3:8000 max_fails=3 fail_timeout=30s;
    }

    # HTTP : redirection permanente vers HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        # Certificat auto-signé généré par scripts/generate-cert.sh
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Uniquement les versions modernes de TLS
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;

        # En-têtes de sécurité de base
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        # En-têtes transmis aux services
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Détection rapide d'un serveur mort + nouvel essai sur un autre réplica
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        location / {
            proxy_pass http://api_backend;
        }

        # Routage par chemin vers les autres microservices
        location /auth {
            proxy_pass http://auth:8000;
        }

        location /orders {
            proxy_pass http://orders:8000;
        }
    }
}
